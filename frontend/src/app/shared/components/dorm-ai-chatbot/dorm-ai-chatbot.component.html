<!-- Cửa sổ hội thoại Chatbot (Chat Window) -->
<div
  *ngIf="aiService.isOpen()"
  class="fixed inset-x-2 bottom-2 top-14 z-40 flex h-auto max-h-[calc(100dvh-4rem)] w-auto flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl animate-in fade-in slide-in-from-bottom-4 duration-200 sm:inset-auto sm:bottom-20 sm:right-6 sm:top-auto sm:h-[520px] sm:max-h-[85vh] sm:w-[380px] sm:rounded-2xl"
>
  <!-- Header -->
  <div class="bg-slate-900 text-white p-4 flex items-center justify-between shrink-0 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-200">
        <ng-icon name="lucideBot" size="18"></ng-icon>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h3 class="text-sm font-semibold tracking-tight text-white">Trợ lý KTX AI</h3>
          <span class="inline-flex items-center gap-1 text-[11px] font-normal text-emerald-400">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Sẵn sàng hỗ trợ
          </span>
        </div>
        <p class="text-[11px] text-slate-400">Hỗ trợ sinh viên Ký túc xá ICTU 24/7</p>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <button
        type="button"
        (click)="closeChat()"
        class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition-colors"
        title="Thu nhỏ"
      >
        <ng-icon name="lucideMinus" size="16"></ng-icon>
      </button>
      <button
        type="button"
        (click)="closeChat()"
        class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition-colors"
        title="Đóng hộp chat"
      >
        <ng-icon name="lucideX" size="16"></ng-icon>
      </button>
    </div>
  </div>

  <!-- Message Area -->
  <div
    #scrollContainer
    class="flex-1 overflow-y-auto p-4 space-y-3.5 bg-slate-50/50 text-sm scroll-smooth"
  >
    <div
      *ngFor="let msg of aiService.messages()"
      class="flex flex-col"
      [class.items-end]="msg.sender === 'user'"
      [class.items-start]="msg.sender === 'bot'"
    >
      <!-- Tin nhắn User -->
      <div
        *ngIf="msg.sender === 'user'"
        class="bg-slate-900 text-white ml-auto max-w-[80%] rounded-2xl rounded-br-none px-4 py-2.5 text-sm shadow-xs"
      >
        <p class="whitespace-pre-line leading-relaxed">{{ msg.text }}</p>
        <span class="block text-[10px] text-slate-400 text-right mt-1 font-mono">{{ msg.time }}</span>
      </div>

      <!-- Tin nhắn Bot -->
      <div
        *ngIf="msg.sender === 'bot'"
        class="bg-slate-100 text-slate-800 mr-auto max-w-[85%] rounded-2xl rounded-bl-none px-4 py-2.5 text-sm space-y-2 border border-slate-200/80 shadow-xs"
      >
        <div class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-600 mb-1">
          <ng-icon name="lucideSparkles" size="13" class="text-slate-900"></ng-icon>
          <span>Trợ lý KTX AI</span>
        </div>
        <p class="whitespace-pre-line leading-relaxed text-slate-800">{{ cleanMarkdown(msg.text) }}</p>

        <!-- Nút Action đề xuất nếu có -->
        <div *ngIf="msg.actionUrl" class="pt-1.5">
          <button
            type="button"
            (click)="navigateToAction(msg.actionUrl)"
            class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-900 bg-white border border-slate-300 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition-colors shadow-2xs"
          >
            <span>{{ msg.actionLabel || 'Xem chi tiết' }}</span>
            <ng-icon name="lucideArrowRight" size="13"></ng-icon>
          </button>
        </div>

        <span class="block text-[10px] text-slate-400 text-left mt-1 font-mono">{{ msg.time }}</span>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="aiService.isTyping()" class="flex items-center gap-2 mr-auto bg-slate-100 border border-slate-200/80 rounded-2xl rounded-bl-none px-3.5 py-2">
      <div class="flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-500 animate-bounce"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-500 animate-bounce [animation-delay:0.2s]"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-500 animate-bounce [animation-delay:0.4s]"></span>
      </div>
      <span class="text-xs text-slate-500 font-medium">Trợ lý AI đang phản hồi...</span>
    </div>
  </div>

  <!-- Quick Chips -->
  <div class="px-3.5 py-2 bg-white border-t border-slate-100 flex items-center gap-1.5 overflow-x-auto shrink-0 no-scrollbar">
    <button
      *ngFor="let chip of quickChips"
      type="button"
      (click)="onSelectChip(chip)"
      class="shrink-0 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-full border border-slate-200 transition-colors"
    >
      {{ chip }}
    </button>
  </div>

  <!-- Footer Input -->
  <div class="p-3 bg-white border-t border-slate-200 shrink-0">
    <form (ngSubmit)="onSend()" class="flex items-center gap-2">
      <input
        type="text"
        [(ngModel)]="inputText"
        name="userQuery"
        placeholder="Hỏi về phòng, giờ KTX, báo hỏng..."
        class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900"
        [disabled]="aiService.isTyping()"
        autocomplete="off"
      />
      <button
        type="submit"
        [disabled]="!inputText.trim() || aiService.isTyping()"
        class="h-11 w-11 shrink-0 rounded-xl bg-slate-900 text-white transition-colors hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40 sm:h-9 sm:w-9"
        title="Gửi câu hỏi"
      >
        <ng-icon name="lucideSend" size="15"></ng-icon>
      </button>
    </form>
  </div>
</div>

<!-- Nút bấm nổi (Floating Trigger) -->
<button
  type="button"
  (click)="toggleChat()"
  class="fixed bottom-4 right-4 z-50 flex items-center gap-2 rounded-full bg-slate-900 px-3 py-3 text-sm font-medium text-white shadow-md transition-all hover:scale-[1.02] hover:bg-slate-800 active:scale-[0.98] sm:bottom-6 sm:right-6 sm:px-4"
  [title]="aiService.isOpen() ? 'Thu gọn Trợ lý KTX' : 'Mở Trợ lý KTX AI'"
>
  <ng-icon [name]="aiService.isOpen() ? 'lucideX' : 'lucideMessageCircle'" size="18"></ng-icon>
  <span>{{ aiService.isOpen() ? 'Đóng AI' : 'Trợ lý KTX AI' }}</span>
</button>
